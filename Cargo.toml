[package]
name = "b10x-sandbox"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false
description = "Respawn the current shell inside a bubblewrap sandbox that mirrors chosen host directories under /workspace"
repository = "https://github.com/beyond10x/sandbox"

[lib]
name = "b10x_sandbox"
path = "src/lib.rs"

[[bin]]
name = "b10x-sandbox"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.20"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

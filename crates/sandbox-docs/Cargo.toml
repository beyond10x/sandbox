[package]
name = "sandbox-docs"
description = "Generates the derived pages of the Sandbox documentation site (CLI, argument lists, crates, status) and checks them for drift."
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/beyond10x/sandbox"
publish = false

[dependencies]
anyhow = "1"
b10x-sandbox = { path = "../.." }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
